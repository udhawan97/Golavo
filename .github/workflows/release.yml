name: Release

# Stable releases build from a v* tag; a manual dispatch can cut a beta build
# (artifacts only — publish is tag-gated, so betas never touch GitHub Releases
# or the updater's releases/latest endpoint).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [beta, stable]
        default: beta

jobs:
  prepare:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12.14" }
      - id: meta
        name: Resolve version & channel
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-beta.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Guard — tag must match the committed version
        if: startsWith(github.ref, 'refs/tags/v')
        # The updater compares the version compiled into tauri.conf.json, so a
        # tag that outruns the committed version would ship a binary that can
        # never see its own successor. Bump first (make release-bump), then tag.
        run: python3 scripts/bump_version.py --check "${GITHUB_REF#refs/tags/}"

  preflight:
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with: { version: "0.11.30" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.23.2" }
      - name: Sync hash-locked release and test environment
        run: uv sync --project packaging --frozen --python 3.12.14
      - name: Guard release version and notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          uv run --project packaging --frozen python scripts/bump_version.py --check "$VERSION"
          test -s "docs/releases/v${VERSION}.md"
      - name: Python, determinism, provenance and isolation gates
        run: |
          uv run --project packaging --frozen ruff check .
          uv run --project packaging --frozen make validate
          uv run --project packaging --frozen bash scripts/check_license_isolation.sh
          uv run --project packaging --frozen python scripts/gen_third_party_notices.py --check
          uv run --project packaging --frozen python -m golavo_core index --output /tmp/rebuilt_index.parquet
          uv run --project packaging --frozen python - <<'PY'
          import hashlib, json, pathlib, sys

          def sha256(path):
              return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()

          rebuilt = sha256("/tmp/rebuilt_index.parquet")
          committed = sha256("data/index/matches_index.parquet")
          recorded = json.loads(
              pathlib.Path("data/index/matches_index.meta.json").read_text()
          )["parquet_sha256"]
          if not rebuilt == committed == recorded:
              print("::error::match index drift — committed copy is not a clean rebuild")
              sys.exit(1)
          PY
          PYTHONPATH="$PWD" uv run --project packaging --frozen pytest -q
      - name: UI and public docs gates
        run: |
          npm --prefix ui ci
          npm --prefix ui test -- --run
          npm --prefix ui run build
          cd ui
          npx playwright install --with-deps chromium
          npm run test:e2e --if-present
          cd ..
          npm --prefix docs-site ci
          npm --prefix docs-site audit --omit=dev --audit-level=high
          npm --prefix docs-site run check
          npm --prefix docs-site run build

  build:
    needs: [prepare, preflight]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Guard — desktop shell present?
        id: guard
        shell: bash
        run: |
          if [ -f desktop/tauri.conf.json ] || [ -f desktop/src-tauri/tauri.conf.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Desktop shell not scaffolded yet (Phase 4). Skipping platform build."
          fi
      - name: Guard — stable releases must be able to sign updates
        if: steps.guard.outputs.ready == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        # A stable release built without the signing key produces installers with
        # no updater compiled in: everyone who installs it is silently stranded
        # off the update chain forever. Fail loudly instead.
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not configured — refusing to cut a stable release whose installs could never auto-update."
            exit 1
          fi
          if grep -q "REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY" desktop/src-tauri/tauri.updater.conf.json; then
            echo "::error::tauri.updater.conf.json still holds the placeholder pubkey — updates built now could never be verified."
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.guard.outputs.ready == 'true'
        with: { python-version: "3.12.14" }
      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        if: steps.guard.outputs.ready == 'true'
        with: { version: "0.11.30" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.ready == 'true'
        with: { node-version: "22.23.2" }
      - name: Activate repository-pinned Rust toolchain
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc --version | awk '{print $2}')" = "1.97.0"
          rustup target add "$TARGET"
      - name: Sync hash-locked sidecar build environment
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: uv sync --project packaging --frozen --python 3.12.14
      - name: Export SBOM, inventory, and verify inputs entering the signer
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p packaging/out
          SOURCE_SHA="$(git rev-parse HEAD)"
          SBOM="packaging/out/release-sbom-${TARGET}.cdx.json"
          uv export --project packaging --frozen --format cyclonedx1.5 > "$SBOM"
          uv run --project packaging --frozen python scripts/release_inventory.py generate \
            --source-sha "$SOURCE_SHA" --target "$TARGET" \
            --sbom "$SBOM" \
            --output "packaging/out/release-inventory-${TARGET}.json"
          uv run --project packaging --frozen python scripts/release_inventory.py validate \
            --source-sha "$SOURCE_SHA" --target "$TARGET" \
            --sbom "$SBOM" \
            --input "packaging/out/release-inventory-${TARGET}.json"
      - name: Build sidecar (PyInstaller) + Tauri bundle
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: uv run --project packaging --frozen bash packaging/build.sh "${{ matrix.target }}"
        env:
          # Updater signing is REQUIRED for stable tags (guard above); Apple
          # code-signing/notarization stays optional — Tauri skips each step
          # when its secret is empty.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload build artifacts
        if: steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: golavo-${{ matrix.target }}
          path: packaging/out/**
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    permissions:
      contents: write
    # Tag-gated AND requires every build leg green: a half-shipped release would
    # publish a latest.json whose missing platform makes update checks error out
    # on that platform (the plugin resolves URLs for the current platform
    # unconditionally). No release beats a broken one.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12.14" }
      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with: { version: "0.11.30" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.23.2" }
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with: { path: dist, merge-multiple: true }
      - name: Sync hash-locked publication verifier
        run: uv sync --project packaging --frozen --python 3.12.14
      - name: Verify platform inventories before signing and publication
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          uv run --project packaging --frozen python scripts/release_inventory.py validate \
            --source-sha "$SOURCE_SHA" --target aarch64-apple-darwin \
            --sbom dist/release-sbom-aarch64-apple-darwin.cdx.json \
            --input dist/release-inventory-aarch64-apple-darwin.json
          uv run --project packaging --frozen python scripts/release_inventory.py validate \
            --source-sha "$SOURCE_SHA" --target x86_64-pc-windows-msvc \
            --sbom dist/release-sbom-x86_64-pc-windows-msvc.cdx.json \
            --input dist/release-inventory-x86_64-pc-windows-msvc.json
      - name: Assemble + validate updater manifest (latest.json)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Per-leg checksum files are superseded by the merged SHA256SUMS.txt.
          rm -f dist/SHA256SUMS-*
          uv run --project packaging --frozen python scripts/make_update_manifest.py generate \
            --dist dist --version "$VERSION" --tag "$TAG" --repo "${{ github.repository }}" \
            --notes-file "docs/releases/v${VERSION}.md"
          uv run --project packaging --frozen python scripts/make_update_manifest.py validate \
            --manifest dist/latest.json --dist dist --tag "$TAG"
      - name: Checksums
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd dist
          sha256sum * > ../SHA256SUMS.txt && mv ../SHA256SUMS.txt .
          cd ..
          npm --prefix desktop ci
          npm --prefix desktop exec tauri signer sign -- dist/SHA256SUMS.txt
          test -s dist/SHA256SUMS.txt.sig
      - name: Publish GitHub Release (draft until every asset is uploaded)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          # Draft first: releases/latest must never point at a release whose
          # latest.json or installers are still uploading. The undraft below
          # makes the cutover atomic.
          draft: true
          # Stable tags publish as REAL releases — the updater endpoint
          # (releases/latest/download/latest.json) skips prereleases entirely.
          prerelease: ${{ needs.prepare.outputs.channel != 'stable' }}
          generate_release_notes: false
          body_path: docs/releases/v${{ needs.prepare.outputs.version }}.md
          files: dist/**
      - name: Undraft — atomic cutover for releases/latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF#refs/tags/}" --draft=false
