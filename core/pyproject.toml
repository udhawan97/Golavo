[project]
name = "golavo-core"
version = "0.17.1"
description = "Golavo modeling library: ingest, warehouse, models, ledger, facts."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Umang Dhawan" }]
dependencies = [
  "cryptography==50.0.0",
  "jsonschema==4.26.0",
  "numpy==2.5.2",
  "pandas==3.0.5",
  "pyarrow==25.0.1",
  "scipy==1.18.0",
]

[project.scripts]
golavo = "golavo_core.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.3", "mypy==2.3.0", "hypothesis==6.165.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["golavo_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
